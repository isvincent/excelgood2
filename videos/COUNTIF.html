<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COUNTIF｜Excel 函數動畫教室</title>
<meta name="description" content="計算範圍中，符合指定條件的儲存格有幾個。">
<meta name="theme-color" content="#107C41">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --c:#107C41; --c-soft:#E3F4EA;
  --bg:#FFF8EE; --bg2:#FFFFFF; --ink:#1F2433; --ink2:#5B6275; --line:#E6DCCB;
  --card:#FFFFFF; --grid:#D9DEE8; --gridhead:#F1F3F8;
  --range:#FFD54A; --key:#4FA3FF; --hit:#2FCB7A; --out:#FF6FA8; --warn:#FF5A4E;
  --cap:#FFFFFF; --capink:#1F2433;
  --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  --mono:"JetBrains Mono",Consolas,"Courier New",monospace;
  --capsize:48px;
}
:root[data-theme="dark"]{
  --bg:#141826; --bg2:#1C2234; --ink:#F2F4FA; --ink2:#AEB6CC; --line:#2E3650;
  --card:#202840; --grid:#3A4566; --gridhead:#283152; --cap:#252E4A; --capink:#F7F8FC;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0E1220;overflow:hidden;font-family:var(--sans);-webkit-tap-highlight-color:transparent}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:0 0;background:var(--bg);color:var(--ink);overflow:hidden;border-radius:0;box-shadow:0 30px 90px rgba(0,0,0,.45)}

/* ---------- background ---------- */
#bgfx{position:absolute;inset:0;pointer-events:none}
#bgfx .blob{animation:drift 18s ease-in-out infinite alternate}
#bgfx .blob:nth-child(2){animation-duration:23s}
#bgfx .blob:nth-child(3){animation-duration:27s}
@keyframes drift{to{transform:translate(60px,-80px) scale(1.12)}}
.dots{opacity:.55}

/* ---------- header ---------- */
#hdr{position:absolute;left:44px;right:44px;top:48px;height:110px;display:flex;align-items:center;gap:22px}
.hbtn{width:96px;height:96px;border-radius:30px;border:0;background:var(--card);box-shadow:0 6px 0 var(--line);display:grid;place-items:center;cursor:pointer;color:var(--ink);transition:transform .15s}
.hbtn:hover{transform:translateY(-3px)} .hbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.hbtn svg{width:50px;height:50px}
#hdrTitle{flex:1;min-width:0}
#hdrCat{display:inline-flex;align-items:center;gap:10px;background:var(--c);color:#fff;font-weight:900;font-size:30px;padding:6px 22px;border-radius:99px}
#hdrName{font:800 50px/1.2 var(--mono);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#counter{font:800 44px var(--mono);color:var(--c);background:var(--card);padding:14px 26px;border-radius:28px;box-shadow:0 6px 0 var(--line)}
#counter small{color:var(--ink2);font-size:30px}
#prog{position:absolute;left:44px;right:44px;top:186px;height:16px;display:flex;gap:8px}
#prog i{flex:1;border-radius:9px;background:var(--line);overflow:hidden;cursor:pointer;position:relative}
#prog i b{position:absolute;inset:0;width:0;background:var(--c);border-radius:9px;transition:width .3s linear}

/* ---------- slides ---------- */
#slides{position:absolute;left:44px;right:44px;top:236px;height:1190px;perspective:2200px}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;gap:28px;opacity:0;pointer-events:none}
.slide.cur{opacity:1;pointer-events:auto}
.stitle{display:flex;align-items:center;gap:20px;font-weight:900;font-size:64px;line-height:1.15;letter-spacing:.5px}
.stitle .num{flex:none;width:92px;height:92px;border-radius:28px;background:var(--c);color:#fff;display:grid;place-items:center;font:800 46px var(--mono);transform:rotate(-6deg);box-shadow:0 8px 0 rgba(0,0,0,.15)}
.rev{opacity:0;transform:translateY(40px) scale(.96);transition:opacity .55s,transform .65s cubic-bezier(.2,1.4,.4,1)}
.rev.on{opacity:1;transform:none}

/* transitions */
.enter-fade{animation:eFade .8s cubic-bezier(.2,.9,.3,1) both}
.leave-fade{animation:lFade .6s ease both}
@keyframes eFade{from{opacity:0;transform:translateY(80px)}to{opacity:1;transform:none}}
@keyframes lFade{to{opacity:0;transform:translateY(-60px)}}
.enter-slide{animation:eSlide .8s cubic-bezier(.2,.9,.3,1) both}
.leave-slide{animation:lSlide .7s cubic-bezier(.6,0,.8,.4) both}
@keyframes eSlide{from{opacity:0;transform:translateX(110%) rotate(4deg)}to{opacity:1;transform:none}}
@keyframes lSlide{to{opacity:0;transform:translateX(-110%) rotate(-4deg)}}
.enter-zoom{animation:eZoom .85s cubic-bezier(.2,1.3,.4,1) both}
.leave-zoom{animation:lZoom .6s ease both}
@keyframes eZoom{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes lZoom{to{opacity:0;transform:scale(1.25);filter:blur(8px)}}
.enter-flip{animation:eFlip .9s cubic-bezier(.2,.9,.3,1) both;transform-origin:50% 50%}
.leave-flip{animation:lFlip .6s ease-in both;transform-origin:50% 50%}
@keyframes eFlip{from{opacity:0;transform:rotateY(-80deg)}to{opacity:1;transform:none}}
@keyframes lFlip{to{opacity:0;transform:rotateY(80deg)}}
.enter-iris{animation:eIris .9s cubic-bezier(.3,.8,.3,1) both}
.leave-iris{animation:lFade .5s ease both}
@keyframes eIris{from{clip-path:circle(0% at 50% 40%)}to{clip-path:circle(150% at 50% 40%)}}
#wipe{position:absolute;inset:0;pointer-events:none;z-index:30;transform:translateX(-101%)}
#wipe.go{animation:wipe .9s cubic-bezier(.7,0,.3,1)}
@keyframes wipe{0%{transform:translateX(-101%)}45%,55%{transform:translateX(0)}100%{transform:translateX(101%)}}

/* title slide */
.t-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:34px}
.t-badge{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.t-badge span{font-weight:900;font-size:34px;padding:10px 28px;border-radius:99px;background:var(--card);box-shadow:0 6px 0 var(--line)}
.t-badge span:first-child{background:var(--c);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.t-name{font:800 1em/1 var(--mono);letter-spacing:-2px;color:var(--c);text-shadow:0 10px 0 var(--c-soft)}
.t-paren{font:800 1em/1 var(--mono);color:var(--ink2)}
.t-sub{font-weight:900;font-size:66px;line-height:1.3}
.t-sum{font-weight:700;font-size:42px;line-height:1.5;color:var(--ink2);max-width:900px}
.t-art{width:820px;height:300px}
.t-art .cell{animation:cellpop 2.4s ease-in-out infinite}
@keyframes cellpop{0%,100%{opacity:.25}50%{opacity:1}}

/* concept */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:30px;flex:1;align-content:center}
.cgrid.n3 > :first-child{grid-column:1/3}
.ccard{background:var(--card);border-radius:44px;padding:44px 36px;box-shadow:0 12px 0 var(--line);display:flex;flex-direction:column;gap:26px;min-height:330px}
.ccard .ico{width:120px;height:120px;border-radius:38px;display:grid;place-items:center;color:#fff}
.ccard .ico svg{width:70px;height:70px}
.ccard p{font-weight:900;font-size:46px;line-height:1.35}
.ccard .k{font:800 34px var(--mono);color:var(--ink2)}

/* syntax */
.fx-big{background:var(--card);border-radius:36px;padding:28px 34px;box-shadow:0 10px 0 var(--line);font:800 60px var(--mono);color:var(--c);display:flex;align-items:center;gap:6px}
.fx-big .eq{color:var(--ink2)}
.argl{display:flex;flex-direction:column;gap:20px;flex:1;justify-content:center}
.argl.many{gap:14px}
.arg{display:flex;align-items:center;gap:24px;background:var(--card);border-radius:32px;padding:22px 28px;box-shadow:0 8px 0 var(--line);border:4px solid transparent}
.arg.opt{border:4px dashed var(--line);box-shadow:none;background:transparent}
.arg .n{flex:none;width:76px;height:76px;border-radius:24px;display:grid;place-items:center;color:#fff;font:800 40px var(--mono)}
.arg .nm{font:800 40px var(--mono);word-break:break-all}
.arg .ds{font-weight:900;font-size:42px;margin-left:auto;text-align:right;flex:none;max-width:46%}
.argl.many .arg{padding:16px 24px}
.argl.many .arg .nm{font-size:34px}
.argl.many .arg .ds{font-size:38px}
.arg .tag{font-size:26px;font-weight:900;color:var(--ink2);display:block}

/* sheet */
.fbar{display:flex;align-items:stretch;background:var(--card);border-radius:28px;box-shadow:0 8px 0 var(--line);overflow:hidden;min-height:104px}
.fbar .fx{flex:none;width:110px;display:grid;place-items:center;background:var(--c);color:#fff;font:italic 800 44px Georgia,serif}
.fbar .code{flex:1;display:block;align-self:center;padding:12px 26px;font:800 44px/1.3 var(--mono);white-space:nowrap;overflow:hidden;font-variant-ligatures:none}
.fbar .code.wrap{white-space:normal;word-break:break-all}
code,.bpart,.fx-big,.nm{font-variant-ligatures:none}
.code .f{color:var(--c)} .code .s{color:#0E9F6E} .code .p{color:var(--ink2)}
.code .r{border-radius:10px;padding:0 4px}
.caret{display:inline-block;width:5px;height:1.1em;background:var(--ink);margin-left:3px;animation:blink 1s steps(1) infinite;vertical-align:middle}
@keyframes blink{50%{opacity:0}}
.sheet-wrap{display:flex;flex-direction:column;align-items:center;gap:22px;flex:1;justify-content:center}
.xl{display:grid;position:relative;background:var(--grid);gap:2px;border:2px solid var(--grid);border-radius:18px;overflow:hidden;box-shadow:0 12px 0 var(--line)}
.xl > div{background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:700;white-space:nowrap;padding:0 8px;position:relative;z-index:1}
.xl .h{background:var(--gridhead);color:var(--ink2);font:800 0.8em var(--mono)}
.xl .th{font-weight:900;background:var(--c-soft);color:var(--ink)}
.xl > .xl-ov{position:absolute;inset:0;display:grid;align-items:stretch;justify-items:stretch;gap:2px;background:transparent;padding:0;z-index:2;pointer-events:none}
.xl .mk{z-index:2;background:transparent;border-radius:8px;opacity:0;transform:scale(1.15);transition:opacity .4s,transform .5s cubic-bezier(.2,1.5,.4,1);pointer-events:none;padding:0}
.xl .mk.on{opacity:1;transform:none}
.mk.range{background:color-mix(in srgb,var(--range) 38%,transparent);outline:5px solid var(--range)}
.mk.key{background:color-mix(in srgb,var(--key) 30%,transparent);outline:5px solid var(--key)}
.mk.hit{background:color-mix(in srgb,var(--hit) 40%,transparent);outline:6px solid var(--hit);animation:pulse 1.2s ease-in-out infinite}
.mk.out{background:color-mix(in srgb,var(--out) 38%,transparent);outline:6px solid var(--out);animation:pulse 1.2s ease-in-out infinite}
.mk.warn{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--warn) 30%,transparent) 0 14px,transparent 14px 28px);outline:6px solid var(--warn)}
@keyframes pulse{50%{outline-offset:6px}}
.legend{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.legend span{display:flex;align-items:center;gap:12px;font-weight:900;font-size:34px;background:var(--card);padding:10px 22px;border-radius:99px;box-shadow:0 5px 0 var(--line)}
.legend i{width:30px;height:30px;border-radius:9px}
.resbox{display:flex;align-items:center;gap:24px}
.resbox .lbl{font-weight:900;font-size:40px;color:#fff;background:var(--out);padding:14px 26px;border-radius:24px;transform:rotate(-3deg)}
.resbox .val{font-weight:900;font-size:58px;background:var(--card);padding:14px 40px;border-radius:26px;box-shadow:0 8px 0 var(--line);border:5px solid var(--out)}
.spill{display:grid;gap:2px;background:#3B82F6;border:4px solid #3B82F6;border-radius:12px;overflow:hidden}
.spill div{background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:800;padding:0 10px;white-space:nowrap}
.spill div.first{background:color-mix(in srgb,#3B82F6 18%,var(--card))}

/* build */
.bline{background:var(--card);border-radius:34px;padding:30px;box-shadow:0 10px 0 var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-height:130px}
.bpart{font:800 42px var(--mono);padding:10px 16px;border-radius:18px;color:#fff}
.bnotes{display:flex;flex-direction:column;gap:20px;flex:1;justify-content:center}
.bnote{display:flex;align-items:center;gap:22px;background:var(--card);border-radius:30px;padding:22px 28px;box-shadow:0 8px 0 var(--line)}
.bnote code{font:800 36px var(--mono);padding:8px 14px;border-radius:14px;color:#fff;max-width:56%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bnote span{font-weight:900;font-size:42px}

/* flow */
.flow{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.fnode{width:840px;display:flex;align-items:center;gap:30px;background:var(--card);border-radius:40px;padding:28px 36px;box-shadow:0 10px 0 var(--line)}
.fnode .st{flex:none;width:104px;height:104px;border-radius:50%;color:#fff;display:grid;place-items:center;font:800 52px var(--mono)}
.fnode b{display:block;font-weight:900;font-size:52px}
.fnode small{display:block;font:800 34px var(--mono);color:var(--ink2);margin-top:4px}
.farrow{height:76px;width:60px}
.farrow path{stroke-dasharray:12 12;animation:dash 0.8s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}

/* compare */
.cmp{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-content:center;position:relative}
.cside{border-radius:44px;padding:36px 30px;display:flex;flex-direction:column;gap:22px}
.cside.l{background:var(--card);box-shadow:0 10px 0 var(--line)}
.cside.r{background:var(--c);color:#fff;box-shadow:0 10px 0 rgba(0,0,0,.2)}
.cside h3{font:800 50px var(--mono);text-align:center;padding-bottom:16px;border-bottom:4px dashed currentColor;margin-bottom:6px;word-break:break-all}
.cside li{list-style:none;font-weight:900;font-size:42px;line-height:1.3;display:flex;gap:14px;align-items:flex-start}
.cside li svg{flex:none;width:48px;height:48px;margin-top:2px}
.cmp{padding-top:90px;align-content:start;margin-top:40px}
.vs{position:absolute;left:50%;top:0;transform:translateX(-50%) rotate(-8deg);width:120px;height:120px;border-radius:50%;background:#FFD54A;color:#1F2433;display:grid;place-items:center;font:900 54px var(--sans);box-shadow:0 8px 0 rgba(0,0,0,.2);z-index:2}

/* tips */
.tips{flex:1;display:flex;flex-direction:column;gap:26px;justify-content:center}
.tip{display:flex;gap:28px;align-items:center;background:var(--card);border-radius:40px;padding:34px 34px;box-shadow:0 10px 0 var(--line)}
.tip .ti{flex:none;width:108px;height:108px;border-radius:34px;display:grid;place-items:center;color:#fff;background:#F5A623}
.tip.warn .ti{background:var(--warn)}
.tip .ti svg{width:64px;height:64px}
.tip p{font-weight:900;font-size:46px;line-height:1.35}

/* quiz */
.qcard{background:var(--card);border-radius:44px;padding:40px;box-shadow:0 10px 0 var(--line);font-weight:900;font-size:52px;line-height:1.4;position:relative}
.qcard .qq{position:absolute;right:30px;top:-46px;width:110px;height:110px;border-radius:50%;background:#FFD54A;color:#1F2433;display:grid;place-items:center;font:900 70px var(--sans);transform:rotate(10deg);box-shadow:0 8px 0 rgba(0,0,0,.18)}
.qopts{display:grid;grid-template-columns:1fr;gap:20px;flex:1;align-content:center}
.qopt{display:flex;align-items:center;gap:26px;background:var(--card);border:5px solid var(--line);border-radius:34px;padding:22px 28px;font-weight:900;font-size:46px;cursor:pointer;transition:transform .2s,background .3s,border-color .3s;color:var(--ink);text-align:left;font-family:var(--sans)}
.qopt:hover{transform:translateX(10px)}
.qopt b{flex:none;width:80px;height:80px;border-radius:24px;display:grid;place-items:center;background:var(--c-soft);color:var(--c);font:800 44px var(--mono)}
.qopt.right{background:color-mix(in srgb,var(--hit) 25%,var(--card));border-color:var(--hit);animation:bounce .6s}
.qopt.right b{background:var(--hit);color:#fff}
.qopt.wrong{border-color:var(--warn);animation:shake .4s}
@keyframes bounce{40%{transform:scale(1.05)}}
@keyframes shake{25%{transform:translateX(-14px)}75%{transform:translateX(14px)}}
.qexp{font-weight:900;font-size:42px;line-height:1.4;background:color-mix(in srgb,var(--hit) 18%,var(--card));border-radius:30px;padding:24px 30px}

/* recap */
.recap{flex:1;display:flex;flex-direction:column;gap:26px;justify-content:center}
.ritem{display:flex;align-items:center;gap:30px;background:var(--card);border-radius:40px;padding:34px 36px;box-shadow:0 10px 0 var(--line);font-weight:900;font-size:52px}
.ritem .ck{flex:none;width:100px;height:100px;border-radius:50%;background:var(--c);display:grid;place-items:center}
.ritem .ck svg{width:60px;height:60px}
.ritem.on .ck path{animation:draw .6s .2s ease forwards}
.ck path{stroke-dasharray:60;stroke-dashoffset:60}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------- caption ---------- */
#cap{position:absolute;left:40px;width:700px;top:1458px;height:300px;display:flex;align-items:center}
#capBox{position:relative;width:100%;min-height:170px;background:var(--cap);color:var(--capink);border-radius:46px;padding:30px 40px;box-shadow:0 12px 0 rgba(0,0,0,.12),0 0 0 5px var(--c) inset;font-weight:900;font-size:var(--capsize);line-height:1.38;text-wrap:pretty;display:flex;align-items:center;transition:opacity .2s}
#capBox::after{content:"";position:absolute;right:-34px;top:50%;width:60px;height:60px;background:var(--cap);transform:translateY(-50%) rotate(45deg);border-radius:8px;box-shadow:5px -5px 0 0 var(--c) inset;clip-path:polygon(0 0,100% 0,100% 100%)}
#capTxt{display:block;width:100%}
#capTxt.in{animation:capIn .35s ease both}
@keyframes capIn{from{opacity:0;transform:translateY(16px)}}
#cap.off #capBox{opacity:0}

/* ---------- speaker ---------- */
#spk{position:absolute;right:16px;top:1414px;width:320px;height:420px;z-index:5}
#spk svg{width:100%;height:100%;overflow:visible}
#head{transform-origin:160px 300px;transform-box:view-box}
#spkName{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:var(--c);color:#fff;font-weight:900;font-size:28px;padding:6px 22px;border-radius:99px;white-space:nowrap;box-shadow:0 5px 0 rgba(0,0,0,.18)}

/* ---------- controls ---------- */
#ctl{position:absolute;left:40px;width:700px;top:1784px;height:104px;display:flex;gap:14px;align-items:center}
#ctl button{height:96px;flex:1;border:0;border-radius:30px;background:var(--card);color:var(--ink);box-shadow:0 6px 0 var(--line);cursor:pointer;display:grid;place-items:center;font:900 32px var(--sans);transition:transform .12s}
#ctl button:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
#ctl button svg{width:48px;height:48px}
#ctl #bPlay{flex:1.6;background:var(--c);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.25)}
#ctl button.dim{opacity:.45}

/* ---------- overlays ---------- */
.ov{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);text-align:center;padding:80px}
.ov.hide{display:none}
.ov h1{font:800 120px var(--mono);color:var(--c)}
.ov h2{font-weight:900;font-size:60px}
.ov p{font-weight:700;font-size:40px;color:var(--ink2);line-height:1.5}
.bigplay{width:300px;height:300px;border-radius:50%;border:0;background:var(--c);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 18px 0 rgba(0,0,0,.2),0 0 0 0 var(--c);animation:ring 2s infinite}
.bigplay svg{width:140px;height:140px;margin-left:20px}
@keyframes ring{70%{box-shadow:0 18px 0 rgba(0,0,0,.2),0 0 0 60px transparent}}
.ovbtns{display:flex;gap:26px;flex-wrap:wrap;justify-content:center}
.ovbtns a,.ovbtns button{font:900 44px var(--sans);padding:28px 48px;border-radius:36px;border:0;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:0 8px 0 var(--line);text-decoration:none;display:flex;align-items:center;gap:14px}
.ovbtns .pri{background:var(--c);color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.2)}
.voice-note{font-size:30px!important}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:60}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="viewport">

let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(freq, dur, type='sine', vol=.12, slide=0, delay=0){
  if(!S.sound) return; const a = ac(); if(!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
function whoosh(){
  if(!S.sound) return; const a = ac(); if(!a) return;
  const n = a.sampleRate * .45, b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.sin(Math.PI*i/n);
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = b; f.type = 'bandpass'; f.Q.value = 1.4;
  f.frequency.setValueAtTime(400, a.currentTime); f.frequency.exponentialRampToValueAtTime(3200, a.currentTime + .4);
  g.gain.value = .09; src.connect(f).connect(g).connect(a.destination); src.start();
}

/* ---------- formula highlighting ---------- */
function hlFormula(f, marks=[]){
  const kindOf = {}; marks.forEach(m => { if(!kindOf[m.range]) kindOf[m.range] = m.kind; });
  const re = /("[^"]*"?)|(\$?[A-Z]{1,3}\$?\d+(?::\$?[A-Z]{1,3}\$?\d+)?)|([A-Z][A-Z0-9.]*)(?=\()|([(),;{}])/g;
  let out = '', last = 0, m;
  while((m = re.exec(f))){
    out += esc(f.slice(last, m.index)); last = re.lastIndex;
    const [all, s, r, fn, p] = m;
    if(s) out += `<span class="s">${esc(s)}</span>`;
    else if(r){ const k = kindOf[r.replace(/\$/g,'')]; out += k ? `<span class="r" style="background:color-mix(in srgb,${KCOL[k]} 40%,transparent)">${r}</span>` : r; }
    else if(fn) out += `<span class="f">${fn}</span>`;
    else out += `<span class="p">${esc(p)}</span>`;
  }
  return out + esc(f.slice(last));
}

/* ---------- slide renderers ---------- */
const colL = i => String.fromCharCode(65 + i);
function pr(r){ const m = r.match(/^([A-Z]+)(\d+)(?::([A-Z]+)(\d+))?$/); if(!m) return null;
  const c1 = m[1].charCodeAt(0)-65, r1 = +m[2]; return m[3] ? [c1, r1, m[3].charCodeAt(0)-65, +m[4]] : [c1, r1, c1, r1]; }

function sheetHTML(s){
  const nc = s.header.length, nr = s.rows.length;
  const spill = s.spill; const spR = spill ? spill.length : 0;
  const nLab = new Set((s.marks||[]).filter(m=>m.label).map(m=>m.label)).size;
  const legH = nLab ? (nLab > 3 ? 165 : 80) : 0;
  const avail = 1190 - 120 - 132 - legH - 44;
  const units = (nr + 2) + (spill ? spR * .9 + .3 : 1.5);
  const rh = Math.max(50, Math.min(90, Math.floor(avail / units)));
  const W = 990 - 72 - nc * 2;
  let fs = Math.min(rh * .44, 40);
  const need = s.header.map((h,c) => Math.max(...[h, ...s.rows.map(r=>r[c])].map(vlen), 2) * fs + 30);
  const tot = need.reduce((a,b)=>a+b, 0);
  let cws;
  if(tot > W){ fs = Math.max(20, fs * W / tot); cws = need.map(w => Math.floor(w * W / tot)); }
  else { const cap = Math.min(W, Math.max(tot, Math.min(W, nc * 190))); cws = need.map(w => Math.floor(w + (cap - tot) / nc)); }
  const cw = cws.join('px ') + 'px';
  let g = `<div class="xl" style="grid-template-columns:72px ${cw};grid-auto-rows:${rh}px;font-size:${fs}px"><div class="h"></div>`;
  for(let c=0;c<nc;c++) g += `<div class="h">${colL(c)}</div>`;
  g += `<div class="h">1</div>` + s.header.map(h=>`<div class="th">${esc(h)}</div>`).join('');
  s.rows.forEach((row, i) => { g += `<div class="h">${i+2}</div>` + row.map(v=>`<div>${esc(v)}</div>`).join(''); });
  g += `<div class="xl-ov" style="grid-template-columns:72px ${cw};grid-template-rows:repeat(${nr+2},${rh}px)">`;
  (s.marks||[]).forEach(m => { const p = pr(m.range); if(!p) return;
    g += `<div class="mk ${m.kind}" data-at="${m.at}" style="grid-row:${p[1]+1}/${p[3]+2};grid-column:${p[0]+2}/${p[2]+3}"></div>`; });
  g += `</div></div>`;
  const seen = new Set();
  const leg = (s.marks||[]).filter(m => m.label && !seen.has(m.label) && seen.add(m.label))
     .map(m => `<span class="rev" data-at="${m.at}"><i style="background:${KCOL[m.kind]}"></i>${esc(m.label)}</span>`).join('');
  let res;
  const ra = s.showResultAt ?? (s.say.length - 1);
  if(spill){
    const sc = Math.max(...spill.map(r=>r.length));
    const sl = Math.max(...spill.flat().map(vlen), 1);
    const scw = Math.min(200, Math.floor(700 / sc));
    const sfs = Math.max(20, Math.min(rh*.42, (scw-18)/sl));
    res = `<div class="resbox rev" data-at="${ra}"><span class="lbl">${T.result}</span><div class="spill" style="grid-template-columns:repeat(${sc},${scw}px);grid-auto-rows:${Math.round(rh*.9)}px;font-size:${sfs}px">` +
      spill.map((r,i)=> r.concat(Array(sc-r.length).fill('')).map((v,j)=>`<div class="${i===0&&j===0?'first':''}">${esc(v)}</div>`).join('')).join('') + `</div></div>`;
  } else {
    const vs = vlen(s.result) > 14 ? 'font-size:42px' : '';
    res = `<div class="resbox rev" data-at="${ra}"><span class="lbl">${T.result}</span><span class="val" style="${vs}">${esc(s.result)}</span></div>`;
  }
  const flen = vlen(s.formula);
  const ffs0 = Math.floor(790 / (flen * 1.04)), wrap = ffs0 < 32, ffs = wrap ? Math.min(40, Math.floor(1580 / (flen * 1.04))) : Math.min(46, ffs0);
  return `<div class="fbar"><div class="fx">fx</div><div class="code${wrap ? ' wrap' : ''}" style="font-size:${ffs}px" data-formula="${esc(s.formula)}"></div></div>
    <div class="sheet-wrap">${g}${leg ? `<div class="legend">${leg}</div>` : ''}${res}</div>`;
}

function render(s, i){
  const n = String(i+1).padStart(2,'0');
  const head = s.type === 'title' ? '' : `<h2 class="stitle"><span class="num">${n}</span><span>${esc(s.title)}</span></h2>`;
  let body = '';
  switch(s.type){
    case 'title': {
      const tfs = Math.min(150, Math.floor(960 / ((L.name.length + 3) * .62)));
      body = `<div class="t-wrap">
        <div class="t-badge rev on"><span>${esc(META.cat.zh)}</span><span>${esc(L.level)}</span><span>${esc(L.version)}</span></div>
        <svg class="t-art" viewBox="0 0 820 300">${titleArt()}</svg>
        <div style="white-space:nowrap;font-size:${tfs}px"><span class="t-name">${esc(L.name)}</span><span class="t-paren">( )</span></div>
        <div class="t-sub">${esc(s.subtitle || L.zh)}</div>
        <div class="t-sum">${esc(L.summary)}</div></div>`;
      break; }
    case 'concept': {
      const pts = s.points || [];
      body = `<div class="cgrid n${pts.length}">` + pts.map((p,k)=>`<div class="ccard rev" data-at="${p.at??k}">
        <div class="ico" style="background:${PAL[k%PAL.length]}">${icon(p.icon)}</div><p>${esc(p.text)}</p></div>`).join('') + `</div>`;
      break; }
    case 'syntax': {
      const args = s.args || [];
      body = `<div class="fx-big"><span class="eq">=</span>${esc(s.func || L.name)}<span class="eq">(</span>` +
        args.map((a,k)=>`<span class="rev" data-at="${a.at??k}" style="color:${PAL[k%PAL.length]}">●</span>`).join('') + `<span class="eq">)</span></div>
        <div class="argl ${args.length > 4 ? 'many' : ''}">` + args.map((a,k)=>`<div class="arg rev ${a.optional?'opt':''}" data-at="${a.at??k}">
          <span class="n" style="background:${PAL[k%PAL.length]}">${k+1}</span>
          <span class="nm">${a.optional?'[':''}${esc(a.name)}${a.optional?']':''}${a.optional?`<span class="tag">${S.lang==='en'?'optional':'可省略'}</span>`:''}</span>
          <span class="ds">${esc(a.desc)}</span></div>`).join('') + `</div>`;
      break; }
    case 'sheet': body = sheetHTML(s); break;
    case 'build': {
      const parts = s.parts || [];
      body = `<div class="bline">` + parts.map((p,k)=>`<span class="bpart rev" data-at="${p.at??k}" style="background:${PAL[k%PAL.length]}">${esc(p.text)}</span>`).join('') + `</div>
        <div class="bnotes">` + parts.filter(p=>p.note).map((p,k)=>`<div class="bnote rev" data-at="${p.at??k}"><code style="background:${PAL[parts.indexOf(p)%PAL.length]}">${esc(p.text)}</code><span>${esc(p.note)}</span></div>`).join('') + `</div>` +
        (s.result ? `<div class="resbox rev" data-at="${s.say.length-1}" style="justify-content:center"><span class="lbl">${T.result}</span><span class="val">${esc(s.result)}</span></div>` : '');
      break; }
    case 'flow': {
      const ns = s.nodes || [];
      body = `<div class="flow">` + ns.map((d,k)=>(k? `<svg class="farrow rev" data-at="${d.at??k}" viewBox="0 0 60 76"><path d="M30 4v56" stroke="var(--c)" stroke-width="8" stroke-linecap="round"/><path d="M14 52l16 18 16-18" fill="none" stroke="var(--c)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" style="animation:none;stroke-dasharray:none"/></svg>`:'') +
        `<div class="fnode rev" data-at="${d.at??k}"><span class="st" style="background:${PAL[k%PAL.length]}">${k+1}</span><div><b>${esc(d.label)}</b><small>${esc(d.sub||'')}</small></div></div>`).join('') + `</div>`;
      break; }
    case 'compare': {
      const n = s.say.length, la = Math.min(1, n-1), ra = Math.min(2, n-1);
      const li = (it, ok) => `<li>${icon(ok?'check':'cross', 3)}<span>${esc(it)}</span></li>`;
      body = `<div class="cmp"><div class="cside l rev" data-at="${la}"><h3>${esc(s.left.head)}</h3>${s.left.items.map(x=>li(x,false)).join('')}</div>
        <div class="vs rev" data-at="${la}">VS</div>
        <div class="cside r rev" data-at="${ra}"><h3>${esc(s.right.head)}</h3>${s.right.items.map(x=>li(x,true)).join('')}</div></div>`;
      break; }
    case 'tips': {
      body = `<div class="tips">` + (s.items||[]).map((t,k)=>`<div class="tip ${t.kind==='warn'?'warn':''} rev" data-at="${t.at??k}"><span class="ti">${icon(t.kind==='warn'?'warn':'bulb')}</span><p>${esc(t.text)}</p></div>`).join('') + `</div>`;
      break; }
    case 'quiz': {
      const ans = s.say.length - 1;
      body = `<div class="qcard rev" data-at="0">${esc(s.question)}<span class="qq">?</span></div>
        <div class="qopts">` + s.options.map((o,k)=>`<button class="qopt rev" data-at="${Math.min(1, s.say.length-1)}" data-k="${k}"><b>${'ABCD'[k]}</b>${esc(o)}</button>`).join('') + `</div>
        <div class="qexp rev" data-at="${ans}" data-answer>${esc(s.explain||'')}</div>`;
      break; }
    case 'recap': {
      body = `<div class="recap">` + (s.items||[]).map((t,k)=>`<div class="ritem rev" data-at="${Math.min(k+1, s.say.length-1)}"><span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>${esc(t)}</div>`).join('') + `</div>`;
      break; }
  }
  const el = document.createElement('section');
  el.className = 'slide'; el.dataset.screenLabel = `${n} ${s.title || L.name}`;
  el.innerHTML = head + body;
  if(s.type === 'quiz'){
    el.querySelectorAll('.qopt').forEach(b => b.addEventListener('click', () => {
      if(+b.dataset.k === s.answer){ b.classList.add('right'); sfx.ding(); confetti(60); }
      else { b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); sfx.click(); }
    }));
  }
  return el;
}

function titleArt(){
  let g = '';
  for(let r=0;r<4;r++) for(let c=0;c<9;c++){
    const x = 10 + c*90, y = 20 + r*66, on = (r*3 + c*5) % 7 === 0;
    g += `<rect class="${on?'cell':''}" x="${x}" y="${y}" width="84" height="60" rx="12" fill="${on ? PAL[(r+c)%PAL.length] : 'var(--card)'}" stroke="var(--line)" stroke-width="3" style="animation-delay:${(r+c)*.18}s"/>`;
  }
  return g;
}

/* ---------- build deck ---------- */
const deck = $('#slides');
const els = L.slides.map((s,i) => { const e = render(s,i); deck.appendChild(e); return e; });
$('#prog').innerHTML = L.slides.map((_,i)=>`<i data-i="${i}" title="${i+1}"><b></b></i>`).join('');
$('#hdrCat').textContent = META.cat[S.lang==='en'?'en':'zh'];
$('#hdrName').textContent = `${L.name} · ${S.lang==='en'?L.en:L.zh}`;
$('#ovCat').textContent = META.cat[S.lang==='en'?'en':'zh'];
$('#ovVer').textContent = L.version;
$('#ovName').textContent = L.name;
$('#ovZh').textContent = S.lang==='en' ? L.en : L.zh;
$('#ovHint').textContent = T.start + ` · ${L.slides.length} ${T.slides}`;
$('#spkName').textContent = T.speaker;
$('#endTitle').textContent = T.done;
$('#endSub').textContent = `${L.name} — ${S.lang==='en'?L.summary_en:L.summary}`;
$('#bReplay').textContent = T.replay;
$('#aHome').textContent = T.hub;
if(META.prev){ $('#aPrev').href = META.prev + '.html'; $('#aPrev').textContent = '← ' + META.prev; } else $('#aPrev').remove();
if(META.next){ $('#aNext').href = META.next + '.html'; $('#aNext').textContent = META.next + ' →'; } else $('#aNext').remove();
document.title = `${L.name}｜Excel 函數動畫教室`;

/* ---------- voice ---------- */
const synth = window.speechSynthesis;
let voice = null, voiceOn = true, rate = 1.15;
const RATES = [1, 1.15, 1.3];
function pickVoice(){
  if(!synth) return null;
  const vs = synth.getVoices().filter(v => /zh[-_](TW|Hant)/i.test(v.lang) || /台灣|臺灣|Taiwan/i.test(v.name));
  const pool = vs.length ? vs : synth.getVoices().filter(v => /^zh/i.test(v.lang));
  const fem = /HsiaoChen|HsiaoYu|Hanhan|Yating|Mei-?Jia|female|女/i, male = /Zhiwei|YunJhe|Yunjhe|male|男/i;
  return pool.find(v => fem.test(v.name) && v.localService === false) || pool.find(v => fem.test(v.name)) ||
         pool.find(v => !male.test(v.name)) || pool[0] || null;
}
function loadVoice(){ voice = pickVoice(); $('#ovVoice').textContent = voice ? T.voiceOk + voice.name : (synth && synth.getVoices().length ? T.voiceNo : ''); }
if(synth){ loadVoice(); synth.addEventListener?.('voiceschanged', loadVoice); }

/* ---------- mouth / speaker animation ---------- */
let talking = false, mouthTarget = 0, mouthV = 0, pulse = 0, lastBlink = 0;
const mo = $('#mo'), mclip = $('#mouthClip'), mopen = $('#mopen'), smile = $('#smile'), eyes = $('#eyes'), head = $('#head');
function anim(t){
  if(talking){
    const n = Math.sin(t/63) * .5 + Math.sin(t/37 + 1) * .3 + Math.sin(t/111) * .2;
    mouthTarget = Math.max(.08, .5 + n * .5 + pulse);
  } else mouthTarget = 0;
  pulse *= .86;
  mouthV += (mouthTarget - mouthV) * .38;
  const o = Math.max(0, Math.min(1, mouthV));
  const ry = 3 + o * 17, rx = 17 + o * 5;
  mo.setAttribute('ry', ry); mo.setAttribute('rx', rx);
  mclip.setAttribute('ry', ry); mclip.setAttribute('rx', rx);
  mopen.setAttribute('opacity', o > .06 ? 1 : 0);
  smile.setAttribute('opacity', o > .06 ? 0 : 1);
  if(t - lastBlink > 3200 + Math.random()*2000){ lastBlink = t; eyes.animate([{transform:'scaleY(1)'},{transform:'scaleY(.1)'},{transform:'scaleY(1)'}], {duration:180, transformOrigin:'160px 192px'}); }
  const bob = talking ? Math.sin(t/260) * 2.2 : Math.sin(t/900) * 1;
  head.setAttribute('transform', `rotate(${bob} 160 300) translate(0 ${talking ? Math.abs(Math.sin(t/190))*-3 : 0})`);
  requestAnimationFrame(anim);
}
eyes.style.transformBox = 'fill-box'; eyes.style.transformOrigin = 'center';
requestAnimationFrame(anim);

/* ---------- playback engine ---------- */
let cur = -1, line = -1, playing = false, token = 0, ended = false;
const TRANS = ['fade','slide','zoom','flip','iris','wipe'];
function setRev(el, idx){
  el.querySelectorAll('[data-at]').forEach(x => {
    const on = +x.dataset.at <= idx;
    if(on && !x.classList.contains('on') && idx >= 0 && x.classList.contains('rev')) sfx.pop();
    x.classList.toggle('on', on);
  });
  if(L.slides[cur]?.type === 'quiz' && idx === L.slides[cur].say.length - 1){
    const b = el.querySelector(`.qopt[data-k="${L.slides[cur].answer}"]`);
    if(b && !b.classList.contains('right')){ b.classList.add('right'); sfx.ding(); confetti(80); }
  }
}
function typeFormula(el){
  const c = el.querySelector('.code[data-formula]'); if(!c) return;
  const f = c.dataset.formula, s = L.slides[cur]; let i = 0;
  clearInterval(c._t);
  c._t = setInterval(() => {
    i += 2; if(i >= f.length){ i = f.length; clearInterval(c._t); }
    c.innerHTML = hlFormula(f.slice(0, i), s.marks) + (i < f.length ? '<span class="caret"></span>' : '');
  }, 34);
}
function updateProg(){
  const segs = $('#prog').children;
  for(let i=0;i<segs.length;i++){
    const n = L.slides[i].say.length;
    const w = i < cur ? 100 : i > cur ? 0 : Math.max(0, (line+1) / n * 100);
    segs[i].firstChild.style.width = w + '%';
  }
  $('#counter').innerHTML = `${String(cur+1).padStart(2,'0')}<small> / ${String(L.slides.length).padStart(2,'0')}</small>`;
}
function go(i, animate=true){
  if(i < 0 || i >= els.length) return;
  const prev = els[cur], next = els[i];
  const tr = TRANS[i % TRANS.length];
  if(prev && prev !== next){
    prev.className = 'slide leave-' + (tr === 'wipe' ? 'fade' : tr);
    setTimeout(() => { if(prev !== els[cur]) prev.className = 'slide'; }, 800);
  }
  cur = i; line = -1;
  next.className = 'slide cur' + (animate ? ' enter-' + (tr === 'wipe' ? 'fade' : tr) : '');
  if(animate && tr === 'wipe'){ const w = $('#wipe'); w.style.background = META.cat.color; w.classList.remove('go'); void w.offsetWidth; w.classList.add('go'); }
  setRev(next, -1);
  if(animate) whoosh();
  typeFormula(next);
  updateProg();
  $('#capTxt').textContent = '';
  try{ localStorage.setItem('xlfx-pos-' + L.id, i); }catch(e){}
}
function showCap(t){ const c = $('#capTxt'); c.classList.remove('in'); void c.offsetWidth; c.textContent = t; c.classList.add('in'); }

function speak(text, tk){
  return new Promise(res => {
    const est = Math.max(1400, [...text].length * 245 / rate);
    let done = false;
    const fin = () => { if(done) return; done = true; talking = false; clearTimeout(guard); res(); };
    const guard = setTimeout(fin, est * 2.2 + 2500);
    if(voiceOn && synth && voice !== undefined && (voice || synth.getVoices().length === 0 ? true : true) && voice){
      const u = new SpeechSynthesisUtterance(text.replace(/[「」]/g, ''));
      u.voice = voice; u.lang = voice.lang || 'zh-TW'; u.rate = rate; u.pitch = 1.05;
      u.onstart = () => { if(tk === token) talking = true; };
      u.onboundary = () => { pulse = .35; };
      u.onend = fin; u.onerror = fin;
      synth.speak(u);
    } else {
      talking = true;
      setTimeout(fin, est);
    }
  });
}
async function run(){
  const tk = ++token;
  while(playing && tk === token){
    const s = L.slides[cur];
    if(line + 1 >= s.say.length){
      if(cur + 1 >= els.length){ finish(); return; }
      await wait(700); if(tk !== token || !playing) return;
      go(cur + 1); await wait(900); if(tk !== token || !playing) return;
      continue;
    }
    line++;
    setRev(els[cur], line);
    updateProg();
    showCap(s.say[line]);
    await speak(s.say[line], tk);
    if(tk !== token) return;
    await wait(260);
  }
}
const wait = ms => new Promise(r => setTimeout(r, ms));
function setPlayIcon(){ $('#pIcon').setAttribute('d', playing ? 'M6 4h4v16H6zM14 4h4v16h-4z' : 'M7 4l13 8-13 8z'); }
function play(){ if(ended){ restart(); return; } playing = true; setPlayIcon(); if(synth) synth.resume(); run(); }
function pause(){ playing = false; token++; talking = false; if(synth) synth.cancel(); setPlayIcon(); }
function jump(i){ const was = playing; pause(); go(i); if(was) play(); }
function restart(){ ended = false; $('#ovEnd').classList.add('hide'); pause(); go(0); play(); }
function finish(){
  playing = false; ended = true; setPlayIcon(); talking = false;
  sfx.tada(); confetti(160);
  try{ const w = JSON.parse(localStorage.getItem('xlfx-watched') || '[]'); if(!w.includes(L.id)){ w.push(L.id); localStorage.setItem('xlfx-watched', JSON.stringify(w)); } }catch(e){}
  setTimeout(() => $('#ovEnd').classList.remove('hide'), 1200);
}

$('#bStart').onclick = () => {
  ac()?.resume?.();
  if(synth){ synth.cancel(); loadVoice(); }
  $('#ovStart').classList.add('hide');
  sfx.click(); go(0); play();
};
$('#bPlay').onclick = () => { sfx.click(); playing ? pause() : play(); };
$('#bPrev').onclick = () => { sfx.click(); jump(Math.max(0, cur - 1)); };
$('#bNext').onclick = () => { sfx.click(); if(cur + 1 < els.length) jump(cur + 1); };
$('#bRate').onclick = () => { rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length]; $('#bRate').textContent = rate + '×'; sfx.click(); };
$('#bCC').onclick = () => { $('#cap').classList.toggle('off'); $('#bCC').classList.toggle('dim'); sfx.click(); };
$('#bVoice').onclick = () => { voiceOn = !voiceOn; $('#bVoice').classList.toggle('dim', !voiceOn); if(!voiceOn && synth) synth.cancel(); sfx.click(); };
$('#bHome').onclick = () => { location.href = '../index.html'; };
$('#bReplay').onclick = restart;
$('#prog').addEventListener('click', e => { const i = e.target.closest('i'); if(i) jump(+i.dataset.i); });
addEventListener('keydown', e => {
  if(!$('#ovStart').classList.contains('hide')){ if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); $('#bStart').click(); } return; }
  if(e.key === ' '){ e.preventDefault(); $('#bPlay').click(); }
  else if(e.key === 'ArrowRight') $('#bNext').click();
  else if(e.key === 'ArrowLeft') $('#bPrev').click();
  else if(e.key === 'Escape') location.href = '../index.html';
});
document.addEventListener('visibilitychange', () => { if(document.hidden && playing) pause(); });

/* ---------- confetti ---------- */
const cv = $('#confetti'), cx = cv.getContext('2d'); let parts = [];
function confetti(n){
  for(let i=0;i<n;i++) parts.push({x:540 + (Math.random()-.5)*300, y:900, vx:(Math.random()-.5)*26, vy:-Math.random()*30-10, r:Math.random()*360, vr:(Math.random()-.5)*20, c:PAL[i%PAL.length], w:14+Math.random()*14, life:0});
  if(parts.length === n) requestAnimationFrame(cstep);
}
function cstep(){
  cx.clearRect(0,0,1080,1920);
  parts.forEach(p => { p.vy += .9; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r*Math.PI/180); cx.fillStyle = p.c; cx.fillRect(-p.w/2, -p.w/4, p.w, p.w/2); cx.restore(); });
  parts = parts.filter(p => p.y < 2000 && p.life < 200);
  if(parts.length) requestAnimationFrame(cstep); else cx.clearRect(0,0,1080,1920);
}

/* initial frame: show title slide statically behind start overlay */
go(0, false);
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
